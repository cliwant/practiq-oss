# Practiq — one-command self-host.
#
#   $ docker compose up -d
#
# That starts:
#   • postgres 16     — the database (port 5432, data persisted in volume)
#   • web             — Next.js app (port 3000)
#
# The MCP server runs OUTSIDE this stack — it's an npm package consumed by your
# MCP client (Claude Desktop / Claude Code / Cursor). See README "MCP install" section.
#
# Before first run:
#   1. cp .env.example .env.local
#   2. Edit .env.local — minimum: OPENROUTER_API_KEY (or ANTHROPIC_API_KEY).
#   3. docker compose up -d
#   4. Open http://localhost:3000 → sign up.
#
# Production hardening (not in this file — see docs/self-host.md):
#   • Enable Postgres SSL.
#   • Run behind an HTTPS reverse proxy (Caddy, nginx, Traefik).
#   • Set NEXTAUTH_SECRET to a strong random value (not the .env.example placeholder).
#   • Mount /var/lib/postgresql/data on a backed-up volume.
#   • Lock down the postgres port — only expose if you need external SQL access.

services:
  postgres:
    image: postgres:16-alpine
    container_name: practiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-practiq}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-practiq}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
    container_name: practiq-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-practiq}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-practiq}

      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # LLM provider — at least one must be set
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # OAuth providers — all optional; auth defaults to credentials/password
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      MICROSOFT_ENTRA_ID_CLIENT_ID: ${MICROSOFT_ENTRA_ID_CLIENT_ID:-}
      MICROSOFT_ENTRA_ID_CLIENT_SECRET: ${MICROSOFT_ENTRA_ID_CLIENT_SECRET:-}

      # Stripe billing — fully optional, self-hosters often skip
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

      # Telemetry (opt-in; defaults to OFF for self-hosters)
      PRACTIQ_TELEMETRY: ${PRACTIQ_TELEMETRY:-off}

      # Disable Vercel-specific code paths
      VERCEL: '0'

      # Self-host mode: disables features that require external services
      # (e.g. Vercel Analytics, Resend webhooks pointed at practiq.dev domain)
      PRACTIQ_SELF_HOST: '1'
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/healthz']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
    name: practiq-postgres-data
