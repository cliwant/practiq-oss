# Venture metadata — read by harness to understand state
name: fractional-ai-command-center
display_name: FractionalOS (→ Context pivot)
status: archived-demo
cycle: 0
started: 2026-03-24
last_activity: 2026-04-09

description: |
  First product exploration in the studio. Started as "FractionalOS" — an
  AI command center for small boutique professional services firms (2-10
  person accounting/law/consulting/agency/HR teams managing 50-200 clients
  each). Pivoted mid-development to the "Context" direction (emphasizing
  the AI's accumulated memory of each client as the core value). The
  mockup is production-grade UI with 5 firm demos (Park Accounting, Chen
  Morgan LLP, North Arc Advisors, Wildcard Studio, Lattice Partners HR).

  Archived as demo material when the studio restructure happened. The
  UI/UX learnings, design system, and firm mock data are preserved as
  reference for future cycles. Not killed — anyone can `cd` in and
  continue if warranted.

stack:
  frontend: Next.js 15 (App Router) + React 19 + Tailwind v4 + motion
  backend: Next.js API Routes + Python FastAPI (planned, not built)
  db: PostgreSQL via Prisma 7 (embedded dev server)
  auth: NextAuth.js v5
  ai: Claude API via Anthropic SDK (scaffolded)

key_artifacts:
  - Fractional_AI_Command_Center_기획서.md  # Product vision (Korean)
  - docs/product/PRD.md                     # Detailed PRD
  - docs/product/UX-DEEP-DESIGN.md          # UX spec (Korean)
  - docs/strategy/AI-NATIVE-AGENT-PHILOSOPHY.md
  - docs/strategy/PIVOT-STRATEGY.md
  - docs/research/                          # Market research notes (9 files)
  - src/components/dashboard/               # 6-view command center UI
  - DESIGN.md                               # Design system spec

how_to_run: |
  cd ventures/fractional-ai-command-center
  npm install
  fnm use 22               # ARM64 Windows — Node 22 LTS required
  npx prisma dev           # separate terminal — embedded Postgres port 51214
  npm run dev              # http://localhost:3000

